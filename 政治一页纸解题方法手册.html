<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#2563eb">
<title>一页纸 · 解题学习工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%233558d4%22/%3E%3Cpath d=%22M8 16h16%22 stroke=%22white%22 stroke-width=%223%22/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#eef4ff; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#dbe6fb;
    --brand:#2563eb; --brand-2:#3b82f6; --brand-soft:#e3edff; --brand-text:#1d4ed8;
    --ok:#16a34a; --ok-soft:#e7f8ee; --bad:#dc2626; --bad-soft:#fdeaea;
    --radius:16px; --shadow:0 6px 20px rgba(37,99,235,.10);
  }
  html.dark{
    --bg:#0f1217;--card:#171b22;--text:#e8ebf0;--muted:#9aa6b6;--line:#2a3240;
    --brand:#5b93ff;--brand-2:#3d7bfd;--brand-soft:#1b2436;--brand-text:#8cb4ff;
    --ok:#4ade80;--ok-soft:#132a1d;--bad:#f87171;--bad-soft:#2b1619;--shadow:0 6px 20px rgba(0,0,0,.35)
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:linear-gradient(180deg,#eaf2ff 0%,#eef4ff 40%,#f6f9ff 100%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 14px calc(env(safe-area-inset-bottom,0px) + 120px);
  }
  html.dark body{background:linear-gradient(180deg,#0e1116,#0f1217 55%,#0e1116)}
  .wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  h1{font-size:21px;margin:4px 0 4px;line-height:1.35}
  h2{font-size:17px;margin:0}
  p{margin:0}
  .muted{color:var(--muted);font-size:13px}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px 14px;border-radius:13px;
       border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15.5px;font-weight:600;
       font-family:inherit;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand-text)}
  .btn.primary{background:linear-gradient(135deg,var(--brand-2),var(--brand));border:none;color:#fff;box-shadow:0 8px 18px rgba(37,99,235,.25)}
  .btn.primary:hover{filter:brightness(1.05);color:#fff}
  .btn.ghost{background:transparent;color:var(--muted);font-weight:500}
  .stack{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .between{justify-content:space-between}
  .link{background:none;border:none;color:var(--brand-text);font-size:13px;font-family:inherit;cursor:pointer;padding:6px}
  .stats{display:flex;gap:9px;margin-top:14px}
  .stat{flex:1;background:var(--brand-soft);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:19px;color:var(--brand-text)}
  .big{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 10px}

  .empty{color:var(--muted);font-size:13.5px;margin-top:6px;max-width:420px}
  .tip{background:var(--brand-soft);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--brand-text);margin-top:12px}
  /* 鸭子 */
  #duck{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:104px;height:104px;
        border-radius:50%;overflow:hidden;background:#eef4ff;border:3px solid #fff;box-shadow:0 10px 24px rgba(37,99,235,.28);
        cursor:pointer;z-index:40;transition:transform .18s}
  #duck:active{transform:scale(.94)}
  #duck video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.06)}
  #duck video.hide{opacity:0}
  #bubble{position:fixed;right:118px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);max-width:150px;
          background:#fff;color:#1d4ed8;border:1px solid #dbe6fb;border-radius:14px 14px 4px 14px;padding:7px 11px;
          font-size:12.5px;font-weight:600;box-shadow:0 6px 16px rgba(37,99,235,.16);opacity:0;transform:translateY(6px);
          transition:.2s;pointer-events:none;z-index:41}
  #bubble.show{opacity:1;transform:none}
  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;
        justify-content:center;padding:18px;z-index:60;opacity:0;pointer-events:none;transition:.2s}
  .mask.show{opacity:1;pointer-events:auto}
  .modal{background:var(--card);isolation:isolate;border-radius:18px;max-width:430px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);
         transform:translateY(12px) scale(.98);transition:.22s}
  .mask.show .modal{transform:none}
  .modal h3{margin:0 0 6px;font-size:18px}
  .modal ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--text)}
  .modal li{margin:5px 0}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:14px;cursor:pointer}
  .chk input{width:16px;height:16px;accent-color:var(--brand)}

  /* 答题 */
  .opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:12px 13px;border:1.5px solid var(--line);
       border-radius:12px;background:var(--card);color:var(--text);font-size:15px;line-height:1.5;font-family:inherit;cursor:pointer;transition:.13s}
  .opt:hover:not(.locked){border-color:var(--brand)}
  .opt .key{flex:none;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;
            background:rgba(37,99,235,.10);color:var(--brand-text);font-size:12.5px;font-weight:700;margin-top:2px}
  .opt.selected{border-color:var(--brand);background:var(--brand-soft)}
  .opt.selected .key{background:var(--brand);color:#fff}
  .opt.correct{border-color:#86efac;background:var(--ok-soft)}
  .opt.correct .key{background:var(--ok);color:#fff}
  .opt.wrong{border-color:#fca5a5;background:var(--bad-soft)}
  .opt.wrong .key{background:var(--bad);color:#fff}
  .opt.locked{cursor:default}
  .stem{font-size:16.5px;font-weight:600;line-height:1.55;margin:0 0 14px;white-space:pre-wrap}
  .topbar{display:flex;align-items:center;gap:10px;padding:0 2px}
  .icon{width:32px;height:32px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;font-family:inherit}
  .track{flex:1;height:5px;border-radius:99px;background:rgba(37,99,235,.15);overflow:hidden}
  .bar{height:100%;background:var(--brand);border-radius:99px;transition:.25s}
  .counter{font-size:12.5px;color:var(--muted);flex:none}
  .tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand-text);font-weight:600}
  #ansAnim{position:fixed;left:50%;top:15%;width:180px;height:180px;border-radius:24px;overflow:hidden;
    transform:translate(-50%,-10px) scale(.9);opacity:0;pointer-events:none;z-index:55;background:#fff;
    box-shadow:0 18px 44px rgba(0,0,0,.22);transition:opacity .2s ease,transform .22s ease;border:3px solid #fff}
  #ansAnim.show{opacity:1;transform:translate(-50%,0) scale(1)}
  #ansAnim.right{border-color:#86efac;box-shadow:0 18px 44px rgba(22,163,74,.28)}
  #ansAnim.wrong{border-color:#fca5a5;box-shadow:0 18px 44px rgba(220,38,38,.28)}
  #ansAnim video{width:100%;height:100%;object-fit:cover;display:block}

  #duckAnim{position:fixed;left:50%;top:50%;width:228px;transform:translate(-50%,-46%) scale(.92);
    opacity:0;pointer-events:none;z-index:56;transition:opacity .22s ease,transform .24s ease;
    border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.30);border:3px solid #fff}
  #duckAnim.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #duckAnim video{width:100%;display:block}
  #duckCap{position:absolute;left:0;right:0;bottom:0;padding:7px 8px 8px;font-size:12px;text-align:center;
    color:#7c2d12;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.94) 42%)}

  h3.sec{font-size:13px;color:var(--muted);margin:16px 0 8px;font-weight:700}
  .mtitle{font-size:18px;font-weight:700;margin:6px 0 10px}
  .fline{font-size:14.5px;line-height:1.7;margin:5px 0;word-break:break-word}
  .fline.bad{color:#b91c1c}
  .fline.ok{color:#15803d}
  .chkmini{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-left:auto;cursor:pointer}
  .chkmini input{width:14px;height:14px;accent-color:var(--brand)}

  .msect{font-size:12.5px;font-weight:700;color:var(--brand-text);margin:14px 0 4px;letter-spacing:.03em}
  .thanks{max-width:680px;margin:18px auto 0;padding:16px 18px;text-align:center;color:var(--muted);font-size:12.5px}
  .thanks h4{font-size:13px;color:var(--text);margin:0 0 8px;font-weight:700;letter-spacing:.05em}
  .thanks .names{line-height:2.1}
  .thanks .names div{white-space:nowrap}
  .credit{max-width:680px;margin:18px auto 0;text-align:right;color:var(--muted);font-size:12.5px;letter-spacing:.04em;padding:0 4px}

  .btn .ico{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,var(--brand-2),var(--brand));font-size:15px;flex:none;margin-right:2px}
  .btn .ico .em{filter:none}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}
  .tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:15px 14px 13px;border-radius:15px;border:none;
    background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;font-family:inherit;text-align:left;cursor:pointer;
    box-shadow:0 10px 22px rgba(29,78,216,.28);transition:transform .14s,filter .14s}
  .tile:hover{filter:brightness(1.06)}
  .tile:active{transform:scale(.975)}
  .tile .tic{font-size:21px;line-height:1.1}
  .tile .tt{font-size:14.5px;font-weight:700;margin-top:5px;line-height:1.3}
  .tile .tc{font-size:11.5px;opacity:.85}
  .fline{font-size:14.5px;line-height:1.8;margin:4px 0;word-break:break-word}
  .fline.bad{color:#b91c1c}
  .fline.ok{color:#15803d}
  .fline.optline{color:var(--muted);padding-left:8px}
  .src{display:inline-block;font-size:11px;color:var(--brand-text);background:var(--brand-soft);border-radius:5px;padding:0 5px;margin:0 2px}

  .fline.fhead{font-size:15.5px;font-weight:700;color:var(--brand-text);margin:14px 0 6px}
  .tomb{color:#dc2626;font-weight:700;font-style:normal;background:rgba(220,38,38,.07);border-radius:4px;padding:0 2px}

  .item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 15px;border:1px solid var(--line);
    border-radius:13px;background:var(--card);color:var(--text);font-family:inherit;font-size:15px;cursor:pointer;
    box-shadow:0 1px 2px rgba(15,23,42,.03);transition:transform .14s,border-color .14s,box-shadow .14s;
    position:relative;overflow:hidden}
  .item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--brand-2),var(--brand))}
  .item:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--shadow)}
  .item::after{content:'›';color:var(--brand);font-size:19px;font-weight:700;line-height:1;opacity:.7}
  .item .t{flex:1;font-weight:600;line-height:1.45}
  .item .m{color:var(--muted);font-size:12px}
  .qbox{background:#f7faff;border:1px solid #dbe6fb;border-left:3px solid var(--brand-2);border-radius:11px;
    padding:10px 12px;margin:10px 0}
  .ql{font-size:13.6px;line-height:1.75;color:#334155;margin:3px 0;word-break:break-word}
  .ql.qopt{color:#475569;padding-left:4px}

  .allred{color:#dc2626;font-weight:600}

  .qrgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .qr{position:relative;aspect-ratio:1/1;border:1.5px dashed #9dbcfa;border-radius:12px;background:#f7faff;
    display:flex;align-items:center;justify-content:center;color:#94a9c9;font-size:11.5px;text-align:center;padding:6px}
  .qrcap{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;line-height:1.4}
  .preface-lead{font-size:14px;line-height:1.75;color:var(--text);margin:8px 0 0}

  .qrimg{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:4px;image-rendering:pixelated}
  .qrph{aspect-ratio:1/1;border:1.5px dashed #9dbcfa;border-radius:10px;background:#f7faff;display:flex;
    align-items:center;justify-content:center;color:#7d97c4;font-size:13px;font-weight:600}
  .qrgrid.two{grid-template-columns:repeat(2,1fr);max-width:300px;margin:10px auto 0}
  .sign{margin-top:18px;text-align:right;color:var(--muted);font-size:13px;line-height:1.9}
  .printsec{margin-top:20px;padding-top:14px;border-top:1px dashed var(--line)}
  .printlead{font-size:13.5px;color:var(--text)}

  .preface-body{margin-top:12px}
  .ppara{font-size:14px;line-height:1.85;margin:10px 0;color:var(--text);text-align:justify}
  .plist{display:flex;gap:8px;font-size:14px;line-height:1.8;margin:8px 0;color:var(--text);text-align:justify}
  .plist .pnum{flex:none;width:20px;height:20px;border-radius:6px;background:var(--brand-soft);color:var(--brand-text);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:3px}
  .pquote{font-size:14px;line-height:1.8;margin:6px 0 6px 2px;padding-left:12px;border-left:3px solid var(--brand-2);color:var(--text)}
  .pstrong{font-size:14.5px;line-height:1.8;margin:12px 0;font-weight:700;color:var(--brand-text);text-align:justify}

  .fbtext{font-size:13.5px;line-height:1.8;color:var(--text);margin:8px 0 0}
  .fbqr{display:block;width:170px;max-width:60%;margin:14px auto 2px;border-radius:12px;border:1px solid var(--line);background:#fff}

  .mimg{display:block;width:100%;border-radius:10px;border:1px solid var(--line);margin:10px 0;background:#fff}

  #vYu{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;border-radius:50%}
  #vYu.show{display:block}
  #duck.yu #vIdle, #duck.yu #vScared{display:none}
  #duck.pulse{animation:pulse .5s ease}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
  .mascotrow{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .mascotrow .lab{font-size:12.5px;color:var(--muted)}
  .mbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);font-family:inherit;font-size:12.5px;
    padding:6px 12px;border-radius:999px;cursor:pointer;transition:.15s}
  .mbtn.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text);font-weight:600}
  #duck.hide{display:none}

  .modal .muted{color:#26313f}
  html.dark .modal .muted{color:#dbe3ee}
  #themeBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:70;
    width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);
    font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 4px 14px rgba(15,23,42,.12)}
  #themeBtn:active{transform:scale(.94)}

  .wbgroup{margin-top:14px}
  .wbtitle{font-size:14px;font-weight:700;color:var(--brand-text);margin-bottom:8px}
  .stem br{line-height:1.2}
  #ansAnim.tall{width:168px;height:224px}

  .tfctx{font-size:12.8px;line-height:1.65;color:var(--muted);background:var(--brand-soft);
    border-radius:10px;padding:8px 10px;margin-bottom:9px}
</style>
<script>
(function(){
  try{
    var t = JSON.parse(localStorage.getItem('duck.tpl.theme') || 'null');
    if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    if (t === 'dark') document.documentElement.classList.add('dark');
  }catch(e){}
})();
</script>
<style>
/* Desktop reading workspace */
:root{--bg:#f5f6f8;--line:#e4e7ec;--brand:#3558d4;--brand-2:#4d6cdb;--brand-soft:#edf1fc;--brand-text:#3454bd;--shadow:none;--radius:12px}
body{background:var(--bg);padding:0;font-size:15px;overflow:hidden}
html.dark body{background:var(--bg)}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93b4ff;outline-offset:3px}
.app-header{height:72px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:32px;padding:0 28px;position:relative;z-index:10}
.brand{display:flex;align-items:center;gap:11px;min-width:245px}.brand-mark{background:var(--brand);color:white;font-weight:800;font-size:19px;border-radius:10px;padding:5px 11px}.brand strong{display:block;font-size:16px;letter-spacing:.02em}.brand small{color:var(--muted);font-size:11px}
.app-tabs{display:flex;gap:5px;height:100%;align-items:center}.nav-btn{border:0;background:none;padding:10px 16px;border-radius:8px;color:var(--muted);white-space:nowrap;font-weight:600}.nav-btn.active{color:var(--brand-text);background:var(--brand-soft)}
.header-tools{margin-left:auto;display:flex;align-items:center;gap:8px}.small-btn{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);padding:7px 12px;white-space:nowrap;font-size:13px}.small-btn:hover{border-color:var(--brand);color:var(--brand-text)}.small-btn.primary{background:var(--brand);color:white;border-color:var(--brand)}
#themeBtn{position:static;box-shadow:none;width:34px;height:34px;border-radius:8px;font-size:15px}
.workspace{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100dvh - 72px)}
.sidebar{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:23px 20px 13px}.eyebrow{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.side-head h2{font-size:18px;margin:3px 0 16px}.search-wrap{position:relative}.search{border:1px solid var(--line);border-radius:8px;padding:10px 36px 10px 11px;background:var(--bg);color:var(--text);width:100%;font-size:13px}.search-clear{position:absolute;right:5px;top:5px;background:none;border:0;color:var(--muted);padding:4px 8px}.filters{display:flex;gap:5px;margin:10px 0 0;flex-wrap:wrap}.filter-btn{font-size:12px;border:1px solid var(--line);padding:4px 9px;background:var(--card);color:var(--muted);border-radius:6px}.filter-btn.active{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-text)}
.side-list{overflow:auto;flex:1;padding:0 12px 16px;scrollbar-width:thin}.group-label{padding:16px 10px 6px;color:var(--muted);font-size:11px;font-weight:700;display:flex;justify-content:space-between}.side-item{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;border:0;background:transparent;color:var(--text);border-radius:7px;padding:9px 10px;font-size:13px;line-height:1.55;margin:2px 0}.side-item:hover{background:var(--bg)}.side-item.active{color:var(--brand-text);background:var(--brand-soft);font-weight:600}.item-no{color:var(--muted);font-size:10px;min-width:21px;padding-top:3px;font-variant-numeric:tabular-nums}.side-item.active .item-no{color:var(--brand-text)}.side-foot{padding:12px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.7}.side-empty{padding:25px 10px;color:var(--muted);font-size:13px}

   "text": "使用边界：本节是经验性提示，不能凭关键词直接判定正误；先判断选项是否正确，再判断是否符合题意。多选没有充分依据时，应回到教材和题干核实，不能把全选当作通用规则。\n\n地方为难你，牢记“X4海南自由贸易港”，如果你听不懂只有特别明显的错误再排除，否则全选，老头不会在这种\n引号内的内容，请继续往下看\n没有明显错误的就全选，这是个好事啊：\n（）设立基层立法联系点有利于A. 健全汇集民智工作机制✅ 〔出处：2025-24〕\nB. 完善民意表达平台和载体✅\nC. 践行全过程人民民主✅\nD. 丰富中国特色社会主义民主形式✅\nbut，如果你做多了魔拟题，你一定会魔了，模拟题在某种程度会严重影响你的思维，让你的分数不增反降，我们假设你在去年上考场前做过以下这样一个人人必做的权威模拟卷\n高标准建设海南自由贸易港，主要目的是A. 促进海南高质量发展B. 助力全国构建新发展格局C. 打造中国式现代化的引领地D. 打造中国新发展格局的战略支点\n这个题的答案是AB，解析的意思是说C的引领和D的战略支点对应的是粤港澳大湾区，而不是海南自由贸易港，所以CD是错的，在你做完这个题后，你会感觉收获满满，学到了海南自由贸易港和引领不匹配，所以以后如果题目问的是海南自由贸易港，选项出现了引领，那就是错的，直接排除\n终于，你来到了去年的考场上，看到了下面这个题，心里狂喜，压住了压住了！封神了封神了！\n于是你快速阅读选项，看到了A说引领，立即推海南和引领不匹配，于是忍不住就把A排除了，选择了BCD\n（）高标准建设海南自由贸易港有利于 〔出处：2026-24〕\nA. 引领新时代高水平对外开放\nB. 助力全国构建新发展格局\nC. 打造形态多样的开放高地\nD. 推动我国自由贸易试验区建设\n那么恭喜你，你少了2分，这个题的答案是全选，因为真题绝对不会以模拟卷的刁钻对应角度恶心你，真题考的是基本立场，而模拟卷只是机构的自娱自乐，这个题目把模拟卷的教条主义体现得淋漓尽致，即使是最权威的模拟卷也会荼毒你的正确做题思路，更小众的某些卷子更是阴的没边了\n我们再看一道X三模拟卷，据说是跟阅卷组权威人员一起编写的，噱头十足：\n1947年12月，中共中央在陕北米脂县杨家沟召开会议，制定了夺取全国胜利行动纲领。毛泽东指出，中国革命已经发展到了一个历史的转折点。这是蒋介石20年反革命统治由发展到消灭的转折点，这是100多年来帝国主义在中国的\n统治由发展到消灭的转折点。随后，他进一步要求全党同志A. 必须和人民群众亲密合作B. 必须牢牢掌握党总路线C. 必须十分注意政策和策略D. 必须维护党的集中统一的领导\n这个题目的答案BCD，不选A人民的原因就是因为原文没有，所以不选，同学们不妨静下心来好好想想考试中心的命题组老头会这样出吗？绝大部分模拟卷真的闹麻了，除了帽子题就是教条主义对应关系，所以大家一定要有独立的思维，以真题为方向复习，少做甚至不做模拟卷，方可事半功倍\n这里大篇幅论述真题和模拟卷的关系，我认为是值得的，我不想看到各位花了时间精力钱财，最后落得一个越学分数越低的下场，说实话去年考完了也没人提这些模拟卷的命题重大错误，因为谁说了都对自己没好处，我也不想消失，但是不吐不快，谢谢各位能耐心看到现在\n正常情况下有利于这里的题目是很简单的，错误一般很明显，比如：\n（）我国数字经济健康发展有利于A. 推动建设现代化经济体系B. 推动构建新发展格局C. 推动化解发展中的根本制约因素D. 推动构筑国家竞争新优势 〔出处：2022-22〕\nC选项有根本，直接排除，具体原因详见后面的墓碑词，选ABD即可\n（）准确把握各地区在国家发展大局中的战略定位有利于A. 发挥各地比较优势，塑造我国发展新优势B. 优化区域经济布局，拓展我国发展动力源C. 统筹发展和安全，掌握我国发展主动权D. 同步实现共同富裕，推动我国发展迈上新台阶 〔出处：2024-25〕\nD同步明显错了，共同富裕不是同步富裕，选ABC即可\n当然，有利于这里也会出一些难题，需要观察力惊人，本质上还是在考不合题意，比如下面这个时政题\n（）河北雄安新区的设立有利于A. 探索人口经济密集地区优化开发新模式B. 探索沿海和内地对外开放新模式C. 调整优化京津冀城市布局和空间结构D. 集中疏解北京的非首都功能 〔出处：2018-32〕\n题干说了是在河北的，不靠海、不是沿海地区（内陆，有白洋淀淡水湖）所以雄安新区的设立不涉及探索沿海和内地对外开放新模式问题，B错误，答案选择ACD，本题的难度系数为0.641，得之我幸，失之我命"

   "text": "只能靠经济力量去实现社会主义❌ 〔出处：文1998-6C〕\n社会主义革命只能在经济发达的国家发生和取得胜利❌ 〔出处：文1998-6A〕\n经济危机的破坏作用只局限于发达资本主义国家❌ 〔出处：2014-20D〕\n价值规律只是资本主义社会特有的经济规律❌\n在我国，我们也要遵循价值规律\n权利行使的方式只能是直接的❌\n权利行使的方式分为直接行使和间接行使\n法律法规只能落后于新技术发展❌ 〔出处：2021-3A〕\n法律法规有时滞后，有时超前\n人只能认识外界物体作用于感官形成的感觉❌ 〔出处：2003-3A〕\n人类能从看得见的现象，推出看不见的本质✅\n比如你看到苹果落地（感官感觉），不只是停留在“苹果掉下来”这个感觉，还能思考、总结出万有引力（理性认识，事物本质）这句话的意思：人只能拿到“苹果掉了”这种感官感受，没法再往下挖到背后规律，这显然不对\n人的价值只体现在特定的场合和行为中❌ 〔出处：2004-3A〕\n人的价值体现在人的全部社会实践活动中\n只有正确的社会意识才能影响社会发展❌ 〔出处：文2000-3C〕\n唯物辩证法认为事物变化发展只有间断性，没有连续性❌ 〔出处：理1997-11C〕\n世界上一切事物只有可能性，没有不可能性❌ 〔出处：2005-2C〕\n世界上只有尚未认识之物，没有不可认识之物✅ 〔出处：2021-17D〕\n人类只能适应自然环境变化而不能改变自然环境❌ 〔出处：2021-18C〕\n人是自然的一部分，人的发展只能适应自然的变化❌ 〔出处：2022-2C〕\n资产阶级政府只代表资产阶级利益❌ 〔出处：理1995-14C〕\n资产阶级政府本质上代表资产阶级的根本利益，但不是说只代表资产阶级利益为了维护统治、缓和阶级矛盾，它会采取一些政策，在一定程度上兼顾普通民众的部分诉求，施舍一些福利\n不是说资产阶级政府真心为人民，只是为了维持统治，被动让步一点点局部利益\n世界上一切事物所具有的特定意义只是经验外化于对象的意义❌ 〔出处：2024-18B〕\n经验外化=主观经验赋予事物意义，事物本身没有客观意义，经典的错误比如大观本身就有意义，不是你的经验投射到大观上大观才有意义的\n矛盾的一方只有克服另一方才能达到统一❌ 〔出处：2003-16D〕\n矛盾对立面的统一（矛盾解决形式）分4类：1. 一方克服另一方（比如革命推翻旧制度，这只是其中一种）2. 矛盾双方同归于尽，产生新事物（奴隶和奴隶主矛盾，一起消亡，进入封建社会）3. 矛盾双方融合成新事物（城乡差别、脑力体力差别，慢慢融合）4. 矛盾双方共存，维持平衡（比如生态系统里捕食者和被捕食者，长期共存）这句话错在“只有”，把多种解决方式压缩成仅一种。\n历史规律只有通过人的有目的、有意识的活动才能实现"

   "text": "【线性、机械、直观、一成不变】都是用孤立片面的方式看待事物的形而上学思维，绝大多数情况是错的\n事物的发展总是呈现出线性上升的态势❌ 〔出处：2015-17C〕\n客观事物的复杂性决定了认识是一个线性发展的过程❌\n由于客观事物具有复杂性，认识世界需要一个过程，这是一个反复循环、螺旋式上升的过程，而非线性发展，认识会在实践中不断深化和拓展，并非单向递进\n社会主义作为新生事物，其成长必然是一帆风顺、线性上升的趋势❌\n社会主义作为新生事物，其成长不会是一帆风顺的，必定要经历螺旋式上升的发展过程\n要对事物本来面目做直观反映❌ 〔出处：2011-17D〕\n认识是对客观世界的直观反映❌\n认识是对客观世界的能动反映\n物质世界是外在于人类的、直观的、机械的、自在的对象❌ 〔出处：2026-17C〕\n法律义务是一成不变的❌ 〔出处：2023-31B〕\n科学社会主义绝不是一成不变的教条✅ 〔出处：2019-21C〕"

   "text": "根本一定是最最最最最重要的那一个，最本质的那一个给大家举一个最通俗易懂的例子，细品下面的三句话：\n墓碑词 › 夸张词\n墓碑词 › 夸张词 › 显性考察\n宇爹是你考研成功的根本因素❌\n小宇是你考研成功的重要因素✅\n你自己的努力是你考研成功的根本因素✅\n以下是大量的科学素材，大家可以阅读一遍，所有人感受：\n科技革命已成为推动社会历史进步的根本动力❌\n人民群众始终是推动社会历史进步的根本动力\n人的物质欲望是社会发展的根本动力❌ 〔出处：2006-4D〕\n社会基本矛盾才是社会发展的根本动力\n偶然因素是决定事物发展趋势的根本性因素❌ 〔出处：2024-2A〕\n法律法规归根到底是新技术发展的内在动力❌ 〔出处：2021-3D〕\n人的经验是判断是非得失的根本尺度❌ 〔出处：2006-3A〕\n法律信仰是法律制定和执行的根本依据❌ 〔出处：2011-31D〕\n爱国主义是个人成功的根本保障❌ 〔出处：2015-13C〕\n中国高铁走出国门、走向世界表明我国传统产业结构调整得到根本性改变❌ 〔出处：2016-22A〕\n我国数字经济健康发展有利于推动化解发展中的根本制约因素❌ 〔出处：2022-22C〕\n社会和谐是中国特色社会主义的根本任务和根本原则❌\nB 〔出处：2007-14A〕\n实现共同富裕是社会主义的根本目标和根本原则✅\nB 〔出处：文2000-22A〕\n坚定政治立场是党的根本宗旨❌ 〔出处：2018-25A〕\n党的根本宗旨是全心全意为人民服务✅\n真题复现：延安精神所体现的党的宗旨是全心全意为人民服务✅ 〔出处：2023-11A〕\n科技革命是摆脱社会危机的根本出路❌ 〔出处：2010-18A〕\n科学技术是社会形态更替的根本标志❌ 〔出处：2010-18B〕\n生产方式是社会形态更替的根本标志✅\n资本有机构成的提高实际上是一个社会增长财富和消除贫困的根本途径❌ 〔出处：2017-20A〕\n资本有机构成提高有利于一个社会增长财富，但并不必然会消除贫困，更不可能是消除贫困的根本途径，反而可能导致并加速资本主义社会的两极分化\n当代资本主义社会劳动方式的转变，表明资本主义生产资料所有制性质正在发生根本的转变❌ 〔出处：2025-21A〕\n中俄两国互办“国家年”活动表明中俄战略协作伙伴关系的内涵已发生根本变化❌ 〔出处：2007-16B〕\n经济危机的发生根本上在于资本主义的基本矛盾✅ 〔出处：2016-19A〕\n运动是物质的根本属性✅ 〔出处：文1996-1A〕"

function legacyMethodDetail(i){

  const m = DATA.methods[i];
  const raw = m.text.split('\n');
  const lines = [];
  raw.forEach(function(l){
    if (lines.length && /^[，。、；：？！）】」』%]/.test(l)) lines[lines.length-1] += l;
    else lines.push(l);
  });

  const OVERRIDES = [
    ['绝对化词', ['必须','一定','绝对','所有','一切','总是','任何','任意']],
    ['简单化词', ['只能','只是','只','和','单纯','纯粹','唯一','一元','总和','线性','机械','直观']],
    ['窄化词', ['只能','只是','只','总是','始终','单纯','纯粹','唯一','一元']],
    ['时态表示词', ['已经','实现了','完成了','一开始就','同时','同步']],
    ['叠加词', ['总和','联合','相加','拼凑']],
    ['夸张词', ['夸大','彻底','根本','主体','夸张','重要']],
    ['否定词', ['不再有','不再','没有','不可能','不包含','否认','并非']],
    ['比较词', ['更优越','更强大','更重要','更高级','高于','超越','比']],
    ['贬低词', ['可有可无','无关紧要','无足轻重','贬低']],
    ['马克思等经典作家原话', ['太好了是马恩原集！找到了！我要的就是这句！']]
  ];

  const isWordList = m.title.indexOf('好词') > -1;
  let KW = [];
  for (let k = 0; k < OVERRIDES.length; k++){
    if (m.title.indexOf(OVERRIDES[k][0]) > -1){ KW = OVERRIDES[k][1].slice(); break; }
  }
  if (!KW.length && !isWordList){
    KW = m.title.replace(/[⚠️⭐\uFE0F]/g, '').split(/[，,、/／]/)
      .map(function(x){ return x.trim(); })
      .filter(function(x){ return x.length >= 1 && x.length <= 8; });
  }
  KW.sort(function(a,b){ return b.length - a.length; });
  const kwRe = KW.length
    ? new RegExp('(' + KW.map(function(x){ return x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')', 'g')
    : null;
  const useGlobal = !KW.length && /词$/.test(m.title);

  const chunks = [];
  let box = [];
  function flush(){ if (box.length){ chunks.push({box: box.slice()}); box = []; } }
  lines.forEach(function(l){
    const opt = /^[A-D][.、．]/.test(l);
    const yr = /^（?\d{4}[-–—]\d{1,2}）?/.test(l);
    if (opt || yr) box.push(l);
    else { flush(); chunks.push({line: l}); }
  });
  flush();

  function fmt(l, plain){
    let h = esc(l);
    if (!plain){
      if (isWordList && (/[A-Za-z]/.test(l) || l.length <= 10)){
        return '<span class="allred">'+h+'</span>';
      }
      if (kwRe) h = h.replace(kwRe, '<em class="tomb">$1</em>');
      else if (useGlobal) h = h.replace(TOMB, '<em class="tomb">$1</em>');
    }
    h = h.replace(/(\d{4}[-–—]\d{1,2})/g, '<span class="src">$1</span>');
    return h;
  }

  const body = chunks.map(function(c){
    if (c.box){
      const inner = c.box.map(function(l){
        const opt = /^[A-D][.、．]/.test(l);
        return '<div class="ql'+(opt?' qopt':'')+'">'+fmt(l, true)+'</div>';
      }).join('');
      return '<div class="qbox">'+inner+'</div>';
    }
    const l = c.line;
    const im = /^\[\[IMG:(\d+)\]\]$/.exec(l);
    if (im){ return '<img class="mimg" src="'+((m.images||[])[+im[1]]||'')+'" alt="原书截图">'; }
    let cls = 'fline';
    if (/^\d+\.\s/.test(l)) cls += ' fhead';
    const wrong = l.indexOf('❌') > -1;
    const right = l.indexOf('✅') > -1;
    if (wrong) cls += ' bad';
    else if (right) cls += ' ok';
    if (/^[A-D][.、．]/.test(l)) cls += ' optline';
    const hasKw = (kwRe && new RegExp(kwRe.source).test(l)) || (useGlobal && new RegExp(TOMB.source).test(l));
    if (l.length <= 10 && !hasKw && l.indexOf('❌') < 0 && l.indexOf('✅') < 0 && !/[。，；：、？！A-Za-z]/.test(l) && !/^[A-D][.、．]/.test(l)) cls += ' fhead';
    return '<div class="'+cls+'">'+fmt(l, right)+'</div>';
  }).join('');

  el.innerHTML =
    '<div class="card"><div class="row between">'+
      '<button class="link" data-act="backList">← 返回</button>'+
      '<span class="muted">'+esc(m.group)+'</span></div>'+
      '<div class="mtitle">'+esc(m.title)+'</div>'+body+
    '</div>';
}

        '<div class="ppara">大家好，首先非常感谢各位的信任，既然同学们能从各种渠道获得一页纸学习，那大家就一定很想突击速成考研政治，我只能说，你们找对资料了！</div>',
        '<div class="ppara">一页纸系列已经过了三年的风雨打磨，是对考研选择题考点最顶级的蒸馏和浓缩，为了原汁原味呈现考点，我依旧坚持手搓，将真正的重点通过可视化的彩色展现在了大家的面前，今年的一页纸做了整体的重构，包含知识点和解题方法两册，知识手册负责给大家补常识，解题手册负责教大家怎么做题，两者分工明确，相得益彰，本册为解题手册。</div>',
        '<div class="ppara">近几年真题呈现出明显的“去帽子化”趋势，考题早已不再局限于对教材原话的机械背诵，更加侧重题干情境与选项之间的内在逻辑，干扰项设置也愈发刁钻。不少选项本身表述无误，实则答非所问；有些语句读起来通顺合理，却常在“根本”、“唯一”和“已经”这类限定词上挖坑。直白来说，单纯依靠死记硬背已经很难稳定拿分，读懂题干设问、辨析选项逻辑，为每一次选择和排除找到合理依据，建立起成熟的解题思维，才是选择题提分的核心。在当下这种命题风格下，解题方法手册是备考重心，知识点手册更多起到辅助作用，大家一定要分清学习主次；但脱离基础知识的解题思路终究是空中楼阁，想要拿下选择题高分，二者必须搭配使用。</div>',
        '<div class="ppara">解题方法不是一套看到关键词就能机械套用的口诀。它的用处，是帮你在考场上少一点凭感觉，多一点有根据的判断。希望大家一边做题，一边把这些方法练成自己的思路：看清题意，辨清选项，该拿的分稳稳拿到。</div>',
        '<div class="ppara">今年的一页纸两册均会在B站澄潇宇上传全新免费配套课程，结合题目讲解，对你高频科学刺激，教你如何高效使用本资料拿分。</div>',
        '<div class="ppara">在同学们真正开始使用一页纸之前，一定要仔细阅读。</div>',
        '<div class="ppara">接下来，我简单介绍一下最新的一页纸解题手册。</div>',
        '<div class="msect">主要特色：</div>',
        '<div class="plist"><span class="pnum">1</span><span>真题是最好的风向标。我系统梳理了历年全部真题，深挖命题底层逻辑，总结出藏在题目背后的命题规律，哪怕是去年试卷中的难题，其干扰项的设置思路也与早年真题高度相似。可是很多同学没有时间刷透上千道真题，也很难自己看透出题人的套路和提炼出题目背后的命题逻辑。这份资料不绕弯、不讲空话，直接带你看懂命题人的想法，相当于把整理好的干货递到大家面前，拿来就能用。</span></div>',
        '<div class="plist"><span class="pnum">2</span><span>解题手册不是“防自学”资料，每一处都有通俗易懂的解释和小巧思，拒绝教科书式的生硬废话，用最直观的方式让大家真正理解这些真知灼见。</span></div>',
        '<div class="plist"><span class="pnum">3</span><span>解题关键词彩色高亮标注，核心要点清晰醒目，快速定位解题突破口，降低阅读和学习成本。</span></div>',
        '<div class="plist"><span class="pnum">4</span><span>本册将方法与练习放在一起。前半部分从单选、多选的基本思路讲起，梳理不合题意、对冲命题、时态问题和“墓碑词”等常见命题手法；后半部分按九个专题编排了133道遴选题，并附有答案速查和逐题解析。</span></div>',
        '<div class="msect">使用注意事项：</div>',
        '<div class="plist"><span class="pnum">1</span><span>大家可以自己阅读一遍，其中解题手册的正确错误说法均制作成了判断题同步上线至小程序（下方扫码获取），大家可以在阅读完以后检测自己是否真正具有判断正误的能力，最后做后面的遴选题，之后可以再听配套视频讲解巩固一遍。</span></div>',
        '<div class="plist"><span class="pnum">2</span><span>最重要的是墓碑词板块，这里给大家把所有墓碑词归纳到一页上放在附录，大家可以撕下来对照观看，考前也可以多过目保持对这些墓碑词的敏感度。</span></div>',
        '<div class="plist"><span class="pnum">3</span><span>大家在平时做选择题的时候，可以用解题手册复盘，勾画、标记、简单补充，形成属于自己的自己的一页纸，你就是一页纸副主编。</span></div>',
        '<div class="ppara">现在肯定还有同学焦虑“政治没复习完，现在还来得及吗？”答案是完全来得及的。新真题趋势下的考研政治重在考查阅读理解能力与政治素养，大多数分数只要掌握结题方法后并不难拿。</div>',
        '<div class="ppara">如果说扎实的知识点打底，能帮你守住选择题30分的保底分，那解题方法，就是帮你冲击40分的关键增量。提分的决胜之处，在于把有限精力聚焦在解题思维的打磨与运用上，而这正是这本《解题手册》的核心使命：</div>',
        '<div class="pquote">以命题趋势为纲，拨开备考迷雾，重塑考研政治备考新思路；</div>',
        '<div class="pquote">以近三十年真题、近四年模拟题为据，纵横梳理，提炼命题规律新结论；</div>',
        '<div class="pquote">以当前命题方向为导向，正本清源，回答考研政治考什么、怎样考、如何备考的核心问题；</div>',
        '<div class="pquote">以解题方法为突破，破除陈旧认知，打破思维定式，革新传统备考逻辑，最终掀起一场关于考研政治备考方法的大讨论！</div>',
        '<div class="pstrong">这不仅是一本解题方法手册，更是一次考研政治备考思想的大解放！！！</div>',
        '<div class="ppara">希望各位科学使用一页纸，今年全新的两册将成为你最可靠的左膀右臂，助你豪取选择40+，我们明年出分见！</div>'].join(''))+'</div>'+

/* Single-file offline application. Existing duck.tpl keys remain compatible. */
const K={stats:'duck.tpl.stats',wrong:'duck.tpl.wrong',session:'duck.desktop.session',last:'duck.desktop.last',read:'duck.desktop.read',prefs:'duck.desktop.prefs'};
let storageFailed=false;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){storageFailed=true;return false}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allQuestions=[...DATA.questions,...DATA.tf],byId=new Map(allQuestions.map(q=>[q.id,q]));
let view='read',query='',filter='all',activeId=store.get(K.read,DATA.methods[0].id),streak=0;
let prefs=store.get(K.prefs,{animation:false,mascot:'none'});
if(!prefs||typeof prefs!=='object')prefs={animation:false,mascot:'none'};
let stats=store.get(K.stats,{done:0,right:0});
if(!validStats(stats))stats={done:0,right:0};
let savedWrong=store.get(K.wrong,[]),wrong=new Set(Array.isArray(savedWrong)?savedWrong.filter(id=>byId.has(id)&&!byId.get(id).review):[]);
let session=restoreSession(store.get(K.session,null));
const el=document.getElementById('screen'),side=document.getElementById('sideList'),mainPane=document.getElementById('mainPane');
let readPosition=0,toastTimer;
function validStats(v){return v&&Number.isSafeInteger(v.done)&&Number.isSafeInteger(v.right)&&v.done>=0&&v.right>=0&&v.right<=v.done}
function restoreSession(v){
 if(!v||!Array.isArray(v.order)||!v.order.length||v.order.length>allQuestions.length||new Set(v.order).size!==v.order.length||v.order.some(id=>!byId.has(id)))return null;
 if(!Number.isInteger(v.pos)||v.pos<0||v.pos>=v.order.length||!v.answers||typeof v.answers!=='object'||Array.isArray(v.answers))return null;
 const answers={};for(const [id,a]of Object.entries(v.answers)){
  if(!v.order.includes(id)||!a||!Array.isArray(a.chosen)||!a.chosen.length||new Set(a.chosen).size!==a.chosen.length||a.chosen.some(i=>!Number.isInteger(i)||i<0||i>=byId.get(id).options.length))return null;
  const q=byId.get(id);if(q.type!=='multiple'&&a.chosen.length!==1)return null;
  answers[id]={chosen:a.chosen,ok:q.review?null:isCorrect(q,a.chosen)};
 }
 const pending=Array.isArray(v.pending)?v.pending:[];const current=byId.get(v.order[v.pos]);
 if(new Set(pending).size!==pending.length||pending.some(i=>!Number.isInteger(i)||i<0||i>=current.options.length))return null;
 return{order:v.order,pos:v.pos,answers,pending,completed:v.completed===true,title:typeof v.title==='string'?v.title.slice(0,80):'继续练习',origin:v.origin==='wrong'?'wrong':'practice'};
}
function isCorrect(q,chosen){return chosen.map(i=>'ABCDEFGH'[i]).sort().join('')===q.answer.split('').sort().join('')}
function persist(){store.set(K.stats,stats);store.set(K.wrong,[...wrong]);store.set(K.session,session)}
function toast(s){const box=document.getElementById('toast');box.textContent=s;box.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.hidden=true,3500)}
function actionButton(label,act,extra='',primary=false){return '<button class="small-btn'+(act==='menu'?' mobile-toggle':'')+(primary?' primary':'')+'" data-act="'+act+'" '+extra+'>'+label+'</button>'}
function pageHead(title,sub,buttons=''){return '<div class="page-head"><div><div class="eyebrow">学习工作台 / '+(view==='read'?'阅读':view==='wrong'?'错题复习':view==='records'?'学习记录':'练习')+'</div><h1>'+title+'</h1><p class="sub">'+sub+'</p></div><div class="toolbar">'+actionButton('☰ 目录','menu','aria-expanded="false" aria-controls="sidebar"')+buttons+'</div></div>'}
function setTopNav(){document.querySelectorAll('[data-tab]').forEach(b=>{const on=b.dataset.tab===view||(view==='quiz'||view==='result')&&b.dataset.tab==='practice';b.classList.toggle('active',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
function go(tab){
 if(view==='read')readPosition=mainPane.scrollTop;
 query='';filter='all';document.getElementById('search').value='';view=tab;setTopNav();updateSidebar();closeMenu();
 if(tab==='read'){readMethod(activeId,false);mainPane.scrollTop=readPosition}
 else if(tab==='practice')practicePage();else if(tab==='wrong')wrongbookPage();else if(tab==='records')recordsPage();
 if(tab!=='read')mainPane.scrollTop=0;
}
function sidebarPool(){let pool=view==='read'||view==='info'||view==='records'?[]:allQuestions;if(view==='wrong')pool=pool.filter(q=>wrong.has(q.id));return pool.filter(q=>(filter==='all'||q.type===filter||filter==='review'&&q.review)&&(!query||(q.q+' '+q.source+' '+q.options.join(' ')).toLowerCase().includes(query.toLowerCase())))}
function updateSidebar(){
 const previousScroll=side.scrollTop;
 const reading=['read','info','records'].includes(view),title=document.getElementById('sideTitle'),filters=document.getElementById('sideFilters'),foot=document.getElementById('sideFoot');
 title.textContent=reading?'手册目录':view==='wrong'?'错题目录':'题库目录';document.getElementById('search').placeholder=reading?'搜索标题、关键词或正文…':'搜索题干、选项或年份…';
 filters.innerHTML=reading?'':[['all','全部'],['single','单选'],['multiple','多选'],['tf','判断'],['review','待核对']].map(([key,t])=>'<button class="filter-btn'+(filter===key?' active':'')+'" data-act="filter" data-filter="'+key+'">'+t+'</button>').join('');
 let html='',count=0;
 if(reading){const groups={};DATA.methods.forEach(m=>{if(!query||(m.title+' '+m.text).toLowerCase().includes(query.toLowerCase()))(groups[m.group]??=[]).push(m)});
  for(const [g,items]of Object.entries(groups)){html+='<div class="group-label"><span>'+esc(g)+'</span><span>'+items.length+'</span></div>';for(const m of items){count++;html+='<button class="side-item'+(m.id===activeId&&view==='read'?' active':'')+'" data-act="read" data-id="'+m.id+'"'+(m.id===activeId?' aria-current="true"':'')+'><span class="item-no">'+String(m.no).padStart(2,'0')+'</span><span>'+esc(m.title)+'</span></button>'}}
 }else{const pool=sidebarPool();count=pool.length;html='<div class="group-label"><span>点击题目直接开始</span><span>'+count+' 题</span></div>'+pool.map(q=>'<button class="side-item'+(session&&view==='quiz'&&session.order[session.pos]===q.id?' active':'')+'" data-act="openQuestion" data-id="'+q.id+'"><span class="item-no">'+q.id.slice(1)+'</span><span>'+esc(q.q.slice(0,54))+(q.q.length>54?'…':'')+(q.review?' <span class="bad-text">待核对</span>':'')+'</span></button>').join('')}
 side.innerHTML=html||'<p class="side-empty">没有匹配内容，试试其他关键词。</p>';
 side.scrollTop=previousScroll;
 if(!query){const active=side.querySelector('.side-item.active');if(active){const box=active.getBoundingClientRect(),bounds=side.getBoundingClientRect();if(box.top<bounds.top||box.bottom>bounds.bottom)active.scrollIntoView({block:'nearest'})}}
 foot.innerHTML=reading?count+' / 73 条手册 · 全文搜索<br>← → 切换文章 · / 搜索':count+' 道题 · 1–4 选择选项<br>← → 切换题目 · Esc 返回';
}
function readMethod(id,reset=true){
 const i=DATA.methods.findIndex(m=>m.id===id);if(i<0)return readMethod(DATA.methods[0].id,reset);
 view='read';activeId=id;store.set(K.read,id);setTopNav();legacyMethodDetail(i);
 const m=DATA.methods[i],markup=el.innerHTML.replace(/<div class="row between">[\s\S]*?<\/div>/,'').replace('class="card"','class="card reading-card"');
 const related=DATA.tf.filter(q=>q.methodId===id);
 el.innerHTML=pageHead('阅读手册','73 条方法与知识条目 · 左侧一键切换',actionButton('写在前面','info')+actionButton('打印本节','print'))+
 '<div class="article-meta"><span>'+esc(m.group)+'</span><span>／</span><span>'+String(i+1).padStart(2,'0')+' / '+DATA.methods.length+'</span><span>约 '+Math.max(1,Math.ceil(m.text.length/450))+' 分钟</span></div>'+markup+
 (m.reviewNote?'<div class="notice warn">校对提示：'+esc(m.reviewNote)+'</div>':'')+
 '<div class="reading-nav">'+actionButton('← '+(i?esc(DATA.methods[i-1].title):'已经是第一节'),'prevRead',i?'':'disabled')+actionButton((i<DATA.methods.length-1?esc(DATA.methods[i+1].title):'已经是最后一节')+' →','nextRead',i<DATA.methods.length-1?'':'disabled')+'</div>'+
 (related.length?'<div class="notice">本节有 '+related.length+' 道判断练习。 '+actionButton('练习本节','related','data-id="'+id+'"')+'</div>':'')+
 '<div class="support">主编：澄潇宇 · 原始资料与插图保留。经验技巧应结合题干与知识点使用。<br>本文件含方法手册，未包含独立的知识点手册。学习记录仅保存在当前浏览器，可在“学习记录”中备份。</div>';
 updateSidebar();if(reset)mainPane.scrollTop=0;
}
function practicePage(){
 view='practice';setTopNav();el.innerHTML=pageHead('练习题库','133 道选择题 + 327 道判断题 · 左侧题目可直接定位')+
 (session&&!session.completed?'<div class="notice">上次练习：'+esc(session.title)+'，已答 '+Object.keys(session.answers).length+' / '+session.order.length+' 题。 '+actionButton('继续练习','resume','','true')+'</div>':'')+
 '<div class="card section-card"><h2>开始一轮练习</h2><p class="muted">选定题型后开始；答题卡可随时跳题，离开与刷新都会保存进度。</p>'+[['choice','选择题','40 道单选 · 93 道多选'],['tf','判断题','327 道判断 · 含来源回溯'],['all','全部题目','共 460 题']].map(([kind,title,desc])=>'<div class="launch-row"><div><div class="launch-title">'+title+'</div><p class="launch-info">'+desc+'</p></div><div class="toolbar">'+actionButton('顺序练习','start','data-kind="'+kind+'"')+actionButton('随机练习','start','data-kind="'+kind+'" data-random="true"')+'</div></div>').join('')+'</div>'+
 '<div class="notice">单选与判断点击即提交；多选选完后提交。待核对题可阅读与作答，但不计入正确率和错题本。</div>';
 updateSidebar();
}
function shuffled(ids){const a=ids.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function begin(ids,title,origin='practice',random=false){
 if(!ids.length)return toast('当前没有可练习的题目');
 if(session&&!session.completed&&Object.keys(session.answers).length&&!confirm('开始新练习会替换当前练习进度，累计统计与错题记录会保留。继续吗？'))return;
 session={order:random?shuffled(ids):ids.slice(),pos:0,answers:{},pending:[],completed:false,title,origin};streak=0;persist();paintQ();closeMenu();
}
function openQuestion(id){
 if(view!=='wrong'&&session&&!session.completed&&session.order.includes(id)){session.pos=session.order.indexOf(id);session.pending=[];persist();paintQ();closeMenu();return}
 const pool=sidebarPool(),ids=pool.map(q=>q.id);if(!ids.includes(id))ids.push(id);
 begin([id,...ids.filter(x=>x!==id)],view==='wrong'?'错题复习':'题库练习',view==='wrong'?'wrong':'practice');
}
function curQ(){return byId.get(session.order[session.pos])}
function sources(q){return (q.references||[]).map(r=>'<a href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer">'+esc(r.label)+'</a>').join(' · ')}
function paintQ(){
 if(!session)return go('practice');view='quiz';setTopNav();const q=curQ(),a=session.answers[q.id],pos=session.pos,total=session.order.length;
 const count=Object.keys(session.answers).length,multi=q.type==='multiple';
 let opts=q.options.map((o,i)=>{let c='opt';if(a){c+=' locked';if(!q.review&&q.answer.includes('ABCDEFGH'[i]))c+=' correct';else if(a.chosen.includes(i))c+=q.review?' selected':' wrong'}else if(session.pending.includes(i))c+=' selected';return '<button class="'+c+'" data-act="opt" data-i="'+i+'" '+(a?'disabled':'')+' aria-pressed="'+(a?a.chosen.includes(i):session.pending.includes(i))+'"><span class="key">'+'ABCDEFGH'[i]+'</span><span>'+esc(o)+'</span></button>'}).join('');
 const expl=a?'<div class="explanation '+(q.review?'':a.ok?'good':'bad')+'"><h3>'+(q.review?'待核对 · 不计分':a.ok?'✓ 回答正确':'✕ 回答错误')+'</h3>'+(!q.review?'正确答案：'+q.answer+'　你的答案：'+a.chosen.map(i=>'ABCDEFGH'[i]).join('')+'\n\n':'')+esc(q.explain||'原资料未提供解析。')+(q.sourceContext?'<details><summary>查看原手册上下文</summary>'+esc(q.sourceContext)+'</details>':'')+(q.methodId?'<div>'+actionButton('回到相关手册','read','data-id="'+q.methodId+'"')+'</div>':'')+(sources(q)?'<div class="support">核对依据：'+sources(q)+'</div>':'')+'</div>':'';
 el.innerHTML=pageHead(esc(session.title),'进度自动保存 · '+count+' / '+total+' 已作答',actionButton('保存并返回','exitQuiz')+actionButton('本轮汇总','finish'))+
 '<div class="quiz-layout"><div class="card quiz-card"><div class="quiz-tools"><div class="tagrow"><span class="tag">'+(multi?'多选':q.type==='tf'?'判断':'单选')+'</span><span class="tag">'+q.id+'</span>'+(q.source?'<span class="tag">'+esc(q.source)+'</span>':'')+'</div><span class="muted">第 '+(pos+1)+' / '+total+' 题</span></div>'+
 (q.review?'<div class="notice warn">本题原始标注存在疑问，暂不计分。'+esc(q.review)+'</div>':'')+(q.ctx?'<div class="tfctx">题目背景：'+esc(q.ctx)+'</div>':'')+
 '<div class="stem">'+esc(q.q)+'</div><div class="stack">'+opts+'</div>'+(!a&&multi?'<div style="margin-top:18px">'+actionButton('提交答案','submit',session.pending.length?'':'disabled',true)+'</div>':'')+expl+
 '<div class="quiz-actions">'+actionButton('← 上一题','prevQ',pos?'':'disabled')+(!a?'<span class="muted">'+(multi?'选择所有符合题意的选项':'点击选项即可作答')+'</span>':'')+actionButton(pos===total-1?'查看本轮汇总':'下一题 →',pos===total-1?'finish':'nextQ','',true)+'</div></div>'+
 '<aside class="card answer-sheet"><h3>本轮答题卡</h3><div class="number-grid">'+session.order.map((id,i)=>{const ans=session.answers[id];return '<button class="q-number'+(i===pos?' current':'')+(ans?(ans.ok===null?'':ans.ok?' good':' bad'):'')+'" data-act="jump" data-pos="'+i+'" aria-label="第 '+(i+1)+' 题'+(ans?ans.ok===null?'，待核对':ans.ok?'，正确':'，错误':'，未答')+'"'+(i===pos?' aria-current="step"':'')+'>'+(i+1)+'</button>'}).join('')+'</div><div class="legend"><span class="good-text">■ 正确</span>　<span class="bad-text">■ 错误</span><br>空白：未答 / 待核对<br>← → 切换 · 数字键作答</div></aside></div>';
 updateSidebar();mainPane.scrollTop=0;
}
function pickOpt(i){if(view!=='quiz'||!session||session.answers[curQ().id])return;const q=curQ();if(i<0||i>=q.options.length)return;
 if(q.type==='multiple'){const selected=new Set(session.pending);selected.has(i)?selected.delete(i):selected.add(i);session.pending=[...selected].sort();persist();paintQ()}else commitAns([i])}
function commitAns(chosen){const q=curQ();if(session.answers[q.id])return;const ok=q.review?null:isCorrect(q,chosen);session.answers[q.id]={chosen,ok};session.pending=[];
 if(ok!==null){stats.done++;if(ok){stats.right++;wrong.delete(q.id);streak=0}else{wrong.add(q.id);streak++}}
 persist();paintQ();if(prefs.animation&&ok!==null)playFeedback(ok);
}
function jump(pos){if(!session||pos<0||pos>=session.order.length)return;session.pos=pos;session.pending=[];persist();paintQ()}
function finish(){if(!session)return go('practice');view='result';setTopNav();const entries=Object.entries(session.answers),scored=entries.filter(([id,a])=>a.ok!==null),right=scored.filter(([id,a])=>a.ok).length,miss=entries.filter(([id,a])=>a.ok===false),remaining=session.order.length-entries.length;
 session.completed=remaining===0;persist();const last={title:session.title,total:session.order.length,answered:entries.length,right,scored:scored.length,date:new Date().toISOString()};store.set(K.last,last);
 el.innerHTML=pageHead('本轮练习汇总',esc(session.title)+(remaining?' · 还可继续完成未答题':' · 已完成本轮'))+
 '<div class="overview"><div class="metric"><strong>'+entries.length+'<small class="muted"> / '+session.order.length+'</small></strong><span>已作答</span></div><div class="metric"><strong>'+(scored.length?Math.round(right/scored.length*100)+'%':'—')+'</strong><span>本轮正确率（不含待核对）</span></div><div class="metric"><strong>'+miss.length+'</strong><span>本轮错题</span></div></div>'+
 '<div class="toolbar">'+actionButton(remaining?'继续未答题（'+remaining+'）':'回看本轮答案','continueRound','',true)+(miss.length?actionButton('重练本轮错题','retryRound'):'')+actionButton('返回题库','practice')+'</div>'+
 '<div class="card section-card"><h2>作答明细</h2>'+session.order.map((id,i)=>{const q=byId.get(id),a=session.answers[id];return '<div class="question-row"><span class="'+(a&&a.ok!==null?(a.ok?'good-text':'bad-text'):'muted')+'">'+(a?a.ok===null?'待核对':a.ok?'✓':'✕':'未答')+'</span><div class="row-body"><p>'+esc(q.q.slice(0,100))+'</p><small>'+q.id+(a?' · 你的答案 '+a.chosen.map(n=>'ABCDEFGH'[n]).join('')+(q.review?'':' · 正确答案 '+q.answer):'')+'</small></div>'+actionButton('查看','jump','data-pos="'+i+'"')+'</div>'}).join('')+'</div>';
 updateSidebar();mainPane.scrollTop=0;
}
function wrongbookPage(){view='wrong';setTopNav();const pool=allQuestions.filter(q=>wrong.has(q.id));el.innerHTML=pageHead('错题本',pool.length+' 道待巩固 · 再次答对后自动移出',pool.length?actionButton('重练全部错题','redoAll','',true):'')+
 (pool.length?'<div class="card section-card">'+pool.map(q=>'<div class="question-row"><div class="row-body"><small>'+q.id+' · '+(q.type==='tf'?'判断':q.type==='multiple'?'多选':'单选')+'</small><p>'+esc(q.q)+'</p></div>'+actionButton('重做这题','openQuestion','data-id="'+q.id+'"')+'</div>').join('')+'</div>':'<div class="card empty-state"><h2>当前没有错题</h2><p>练习中答错的题会自动收录，答对后移出。</p><div style="margin-top:20px">'+actionButton('开始练习','practice','',true)+'</div></div>');updateSidebar()}
function recordsPage(){view='records';setTopNav();const last=store.get(K.last,null);el.innerHTML=pageHead('学习记录','保留原有累计统计 · 支持导出与恢复')+
 '<div class="overview"><div class="metric"><strong>'+stats.done+'</strong><span>累计作答次数</span></div><div class="metric"><strong>'+(stats.done?Math.round(stats.right/stats.done*100)+'%':'—')+'</strong><span>累计正确率</span></div><div class="metric"><strong>'+wrong.size+'</strong><span>当前错题</span></div></div>'+
 '<div class="card section-card"><h2>专注设置</h2><div class="preferences"><label><input type="checkbox" id="animationPref" '+(prefs.animation?'checked':'')+'> 答题动画</label><label>伴学形象 <select id="mascotPref"><option value="none">不显示</option><option value="duck">小黄鸭</option><option value="yu">牢宇</option></select></label></div><p class="muted">默认关闭动画与悬浮形象，选择会保存在本机。</p></div>'+
 '<div class="card section-card"><h2>备份与恢复</h2><p class="muted">导出包含累计统计、错题、当前练习、阅读位置和偏好设置。更换浏览器或清理缓存前，请先保存备份。</p><div class="toolbar" style="margin:18px 0">'+actionButton('导出学习记录','export','',true)+'<label class="small-btn">导入备份<input type="file" id="importFile" accept=".json,application/json" hidden></label></div><p id="storageState" class="muted">'+(storageFailed?'当前浏览器无法写入本地记录，请及时导出备份。':'记录仅保存在当前浏览器，不会上传。')+'</p></div>'+
 '<div class="card section-card"><h2>最近一次汇总</h2><p class="muted">'+(last&&typeof last.title==='string'?esc(last.title)+' · 已答 '+Number(last.answered||0)+' / '+Number(last.total||0)+' · 答对 '+Number(last.right||0)+' 题':'完成练习或查看本轮汇总后，会显示在这里。')+'</p></div>'+
 '<div class="notice">题库校对记录：t231 已改为“错误”；t076 标为待核对并暂停计分。历史累计统计保留，无法追溯重算。</div>';
 document.getElementById('mascotPref').value=prefs.mascot||'none';updateSidebar()}
function exportRecords(){const backup={format:'onepage-study',version:2,date:new Date().toISOString(),stats,wrong:[...wrong],session,read:activeId,prefs,last:store.get(K.last,null)};const url=URL.createObjectURL(new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='一页纸学习记录-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('学习记录已导出')}
async function importRecords(file){if(!file)return;try{if(file.size>3*1024*1024)throw Error('文件过大');const b=JSON.parse(await file.text());if(b.format!=='onepage-study'||b.version!==2||!validStats(b.stats)||!Array.isArray(b.wrong)||b.wrong.some(id=>!byId.has(id))||b.session&&!restoreSession(b.session)||!DATA.methods.some(m=>m.id===b.read)||!b.prefs||typeof b.prefs.animation!=='boolean'||!['none','duck','yu'].includes(b.prefs.mascot))throw Error('备份格式或数据不完整');if(!confirm('导入会替换当前浏览器的学习记录，建议先导出当前记录。继续导入吗？'))return;stats=b.stats;wrong=new Set(b.wrong.filter(id=>!byId.get(id).review));session=restoreSession(b.session);activeId=b.read;prefs=b.prefs;persist();store.set(K.read,activeId);store.set(K.prefs,prefs);store.set(K.last,b.last||null);applyMascot();recordsPage();toast('已恢复学习记录')}catch(e){toast('导入失败：'+e.message)}}
function applyMascot(){const box=document.getElementById('duck');box.classList.toggle('hide',prefs.mascot==='none');box.classList.toggle('yu',prefs.mascot==='yu');document.getElementById('vYu').classList.toggle('show',prefs.mascot==='yu');for(const id of ['vIdle','vScared']){const v=document.getElementById(id);v.pause();if(prefs.mascot==='duck'&&id==='vIdle')v.play().catch(()=>{})}}
function playFeedback(ok){const box=document.getElementById('ansAnim'),v=document.getElementById('ansVid');box.classList.remove('right','wrong');box.classList.add(ok?'right':'wrong');v.src=curQ().type==='tf'?(ok?ANS_TF.right:ANS_TF.wrong):(ok?ANS.right:ANS.wrong);box.classList.add('show');v.play().catch(()=>{});clearTimeout(box._t);box._t=setTimeout(()=>{box.classList.remove('show');v.pause()},1800)}
function showInfo(){view='info';setTopNav();legacyPrefacePage();el.innerHTML=pageHead('写在前面','原作者说明与配套资源',actionButton('返回阅读','read','data-id="'+activeId+'"'))+'<div class="original-info">'+el.innerHTML+'</div>';updateSidebar();mainPane.scrollTop=0}
function showHelp(){document.getElementById('helpDialog').showModal()}
function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('open');document.getElementById('sidebar').removeAttribute('aria-modal');document.querySelector('[data-act="menu"]')?.setAttribute('aria-expanded','false')}
function menu(){const sidebar=document.getElementById('sidebar'),open=!sidebar.classList.contains('open');sidebar.classList.toggle('open',open);document.getElementById('scrim').classList.toggle('open',open);document.querySelector('[data-act="menu"]')?.setAttribute('aria-expanded',String(open));if(open)document.getElementById('search').focus()}
function readStep(delta){const i=DATA.methods.findIndex(m=>m.id===activeId)+delta;if(i>=0&&i<DATA.methods.length)readMethod(DATA.methods[i].id)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-tab]');if(!t||t.disabled)return;if(t.dataset.tab){go(t.dataset.tab);return}const a=t.dataset.act;
 if(a==='read'){query='';document.getElementById('search').value='';readMethod(t.dataset.id||activeId);closeMenu()}
 else if(a==='prevRead')readStep(-1);else if(a==='nextRead')readStep(1);
 else if(['practice','wrong','records'].includes(a))go(a);
 else if(a==='start'){const ids=allQuestions.filter(q=>t.dataset.kind==='all'||(t.dataset.kind==='tf'?q.type==='tf':q.type!=='tf')).map(q=>q.id);begin(ids,(t.dataset.kind==='tf'?'判断题':t.dataset.kind==='all'?'全部题目':'选择题')+(t.dataset.random?' · 随机练习':' · 顺序练习'),'practice',!!t.dataset.random)}
 else if(a==='related')begin(DATA.tf.filter(q=>q.methodId===t.dataset.id).map(q=>q.id),'本节判断练习');
 else if(a==='openQuestion')openQuestion(t.dataset.id);
 else if(a==='resume')paintQ();else if(a==='opt')pickOpt(+t.dataset.i);else if(a==='submit'&&session.pending.length)commitAns(session.pending.slice());
 else if(a==='prevQ')jump(session.pos-1);else if(a==='nextQ')jump(session.pos+1);else if(a==='jump')jump(+t.dataset.pos);
 else if(a==='finish')finish();else if(a==='exitQuiz'){persist();go(session.origin==='wrong'?'wrong':'practice')}
 else if(a==='continueRound'){const i=session.order.findIndex(id=>!session.answers[id]);jump(i<0?0:i)}
 else if(a==='retryRound'){const ids=session.order.filter(id=>session.answers[id]?.ok===false);begin(ids,'本轮错题复习','wrong')}
 else if(a==='redoAll')begin(allQuestions.filter(q=>wrong.has(q.id)).map(q=>q.id),'错题复习','wrong');
 else if(a==='filter'){filter=t.dataset.filter;updateSidebar()}
 else if(a==='clearSearch'){query='';document.getElementById('search').value='';updateSidebar();document.getElementById('search').focus()}
 else if(a==='export')exportRecords();else if(a==='menu')menu();else if(a==='closeMenu')closeMenu();else if(a==='info')showInfo();else if(a==='help')showHelp();else if(a==='closeHelp')document.getElementById('helpDialog').close();else if(a==='print')window.print();
});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim();updateSidebar()});
document.addEventListener('change',e=>{if(e.target.id==='animationPref'){prefs.animation=e.target.checked;store.set(K.prefs,prefs)}if(e.target.id==='mascotPref'){prefs.mascot=e.target.value;store.set(K.prefs,prefs);applyMascot()}if(e.target.id==='importFile')importRecords(e.target.files[0])});
document.addEventListener('keydown',e=>{if(document.getElementById('helpDialog').open)return;if(e.key==='Escape'){if(document.getElementById('sidebar').classList.contains('open')){closeMenu();return}if(view==='quiz'){go(session.origin==='wrong'?'wrong':'practice');return}if(view==='info')go('read');return}if(e.target.closest('input,textarea,select,button,a,summary,[contenteditable]')||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key==='/'){e.preventDefault();if(innerWidth<=760&&!document.getElementById('sidebar').classList.contains('open'))menu();document.getElementById('search').focus()}
 if(view==='read'&&e.key==='ArrowLeft'){e.preventDefault();readStep(-1)}if(view==='read'&&e.key==='ArrowRight'){e.preventDefault();readStep(1)}
 if(view==='quiz'){if(/^[1-8]$/.test(e.key)){e.preventDefault();pickOpt(+e.key-1)}if(e.key==='ArrowLeft'){e.preventDefault();jump(session.pos-1)}if(e.key==='ArrowRight'){e.preventDefault();jump(session.pos+1)}if(e.key==='Enter'&&session.pending.length){e.preventDefault();commitAns(session.pending.slice())}}
});
document.getElementById('themeBtn').addEventListener('click',()=>{const dark=document.documentElement.classList.toggle('dark');document.getElementById('themeBtn').textContent=dark?'☀':'☾';store.set('duck.tpl.theme',dark?'dark':'light')});
document.getElementById('themeBtn').textContent=document.documentElement.classList.contains('dark')?'☀':'☾';
document.getElementById('duck').addEventListener('click',()=>{const bubble=document.getElementById('bubble');bubble.textContent='按自己的节奏，继续学习。';bubble.classList.add('show');clearTimeout(bubble._t);bubble._t=setTimeout(()=>bubble.classList.remove('show'),1500)});
window.addEventListener('beforeunload',persist);
applyMascot();go('read');
if(storageFailed)toast('当前浏览器无法保存记录，请在学习记录中导出备份');

</script>
